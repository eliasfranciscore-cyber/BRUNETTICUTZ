<!doctype html>
<!-- Imagen de vista previa de /metodo (public/assets/og-metodo.jpg, 1200×630):
     la que muestran WhatsApp, Instagram y Facebook al compartir el enlace
     (og:image, ver src/routeMeta.js). Para regenerarla, desde la raíz del repo:

       "<chrome-headless-shell>" --headless --hide-scrollbars --window-size=1200,630 \
         --screenshot=/tmp/og-metodo.png scripts/brand/og-metodo.html
       sips -s format jpeg -s formatOptions 82 /tmp/og-metodo.png --out public/assets/og-metodo.jpg

     (cualquier Chrome sirve: el de Playwright vive en ~/Library/Caches/ms-playwright). -->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0907; }
  .card { position: relative; width: 1200px; height: 630px; font-family: "Avenir Next", "Helvetica Neue", sans-serif; color: #f6f5f3; }
  .photo { position: absolute; right: 0; top: 0; width: 700px; height: 630px; object-fit: cover; object-position: 50% 18%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0907 0%, #0a0907 48%, rgba(10, 9, 7, 0.55) 66%, rgba(10, 9, 7, 0.05) 100%); }
  .glow { position: absolute; inset: 0; background: radial-gradient(700px 420px at 12% 0%, rgba(201, 161, 78, 0.22), transparent 65%); }
  .copy { position: absolute; left: 72px; top: 70px; width: 640px; }
  .kicker { display: inline-block; padding: 9px 18px; border: 1.5px solid rgba(201, 161, 78, 0.6); border-radius: 999px; color: #e7c87e; font-size: 20px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 600; }
  .callout { margin-top: 34px; color: #e6cd90; font-size: 27px; font-weight: 600; line-height: 1.3; }
  h1 { margin-top: 14px; font-size: 62px; line-height: 1.04; font-weight: 700; letter-spacing: -0.01em; background: linear-gradient(180deg, #fff 35%, #e6d4ac); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 26px; color: rgba(245, 244, 242, 0.72); font-size: 24px; line-height: 1.4; }
  .foot { position: absolute; left: 72px; bottom: 52px; display: flex; gap: 22px; align-items: center; color: rgba(245, 244, 242, 0.62); font-size: 21px; letter-spacing: 0.04em; }
  .foot b { color: #e7c87e; font-weight: 600; }
  .bar { width: 42px; height: 2px; background: #c9a14e; }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="../../public/assets/bruno-hero.jpg" alt="" />
    <div class="shade"></div>
    <div class="glow"></div>
    <div class="copy">
      <span class="kicker">Método Brunetti</span>
      <p class="callout">Para barberos que ya cortan bien</p>
      <h1>De $12.000 a $20.000 por corte, sin perder clientes</h1>
      <p class="sub">6 módulos y 21 lecciones de Bruno «Brunetti» Herrera, nominado a los Aconcagua Barber Awards.</p>
    </div>
    <div class="foot"><span class="bar"></span><b>brunetticutz.cl/metodo</b><span>Lección gratis</span></div>
  </div>
</body>
</html>
