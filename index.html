<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Cache-bust 2026-09-29 (script inline del tema → /boot.js). Antes: 2026-09-24. Los headers de vercel.json (HSTS y la CSP nueva)
         viajan solo en la respuesta 200: un 304 NO los reenvía, así que quien
         ya tenía este HTML cacheado seguiría con los de antes. Cambiar los bytes
         de este archivo fuerza un ETag nuevo y con él un 200 con los headers
         frescos. Desde este mismo deploy el HTML va con Cache-Control: no-store
         (ver vercel.json), así que no debería volver a hacer falta tocarlo. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/brunetti-logo-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/brunetti-logo-icon-192.png" />
    <!-- iOS no usa SVG para el icono de inicio: PNG 180 para "Añadir a inicio". -->
    <link rel="apple-touch-icon" href="/assets/brunetti-logo-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Tipografías góticas (blackletter): Pirata One para el hero "BRUNETTI";
         Manufacturing Consent para el logotipo de texto del navbar. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&family=Pirata+One&display=swap" rel="stylesheet" />
    <!-- Preload del hero (elemento LCP de la landing) para acelerar el primer paint. -->
    <link rel="preload" as="image" href="/assets/bruno-hero.jpg" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brunetti" />
    <!-- Evita que iOS auto-detecte y estilice los teléfonos (caja negra en modo claro). -->
    <meta name="format-detection" content="telephone=no" />
    <title>Brunetti · Barbería Premium Maipú</title>
    <meta name="description" content="Barbería premium en Maipú, Santiago. Reserva tu cita online con Bruno Herrera. Brunetti — visagismo y estilo masculino de excelencia." />
    <link rel="canonical" href="https://brunetticutz.cl/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brunetti" />
    <meta property="og:url" content="https://brunetticutz.cl/" />
    <meta property="og:title" content="Brunetti · Barbería Premium" />
    <meta property="og:description" content="Reserva tu cita en segundos. Visagismo, cortes y experiencia premium en Maipú, Santiago." />
    <!-- theme-color único y dinámico: lo sincroniza el JS con data-theme (NO con
         prefers-color-scheme), porque el tema real lo decide el toggle / la hora
         de Santiago. Así iOS no pinta las barras sup/inf con el color del tema
         contrario al que se ve en pantalla. -->
    <meta name="theme-color" content="#080807" />
    <!-- Tema inicial sin flash (+ ruta de arranque del documento): /boot.js,
         síncrono a propósito — tiene que correr antes del primer paint. Vive
         en un archivo y no inline porque /cursos/(.+) (la Brunetti Academy)
         lleva un CSP sin 'unsafe-inline' en script-src (ver vercel.json y
         public/boot.js). -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
